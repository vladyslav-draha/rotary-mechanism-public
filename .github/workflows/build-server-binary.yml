name: Build server binary

# Manual dispatch only: builds the AirUnit radar server as a single-file
# Nuitka binary for the Pi (aarch64, no internet on target).
# Inputs: server_ref (branch/tag/SHA of the private server repo,
# default main) and an optional release_tag
# (empty = build + smoke tests only, no Release).
#
# NOTE: the binary targets the BUILD machine: ubuntu-22.04-arm
# (glibc 2.35) runs on DietPi Bookworm (glibc 2.36). Do NOT move this
# to ubuntu-24.04-arm without re-checking glibc compatibility.

on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: "Server branch, tag or SHA to build"
        required: false
        default: "main"
      release_tag:
        description: "Create GitHub Release with this tag (empty = build only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout server at requested ref
        uses: actions/checkout@v4
        with:
          # Token: fine-grained PAT with Contents: read on
          # rotary-mechanism-server, stored as PRIVATE_REPOS_TOKEN
          # in this repository's Secrets.
          repository: vladyslav-draha/rotary-mechanism-server
          ref: ${{ inputs.server_ref }}
          token: ${{ secrets.PRIVATE_REPOS_TOKEN }}
          path: server

      - name: Record resolved SHA
        run: |
          SHA=$(git rev-parse HEAD)
          echo "server $SHA"
          echo "$SHA" > server-sha.txt

      - name: Install build tools
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends gcc patchelf ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-22.04-arm-${{ hashFiles('server/uv.lock') }}
          restore-keys: ccache-22.04-arm-

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Build onefile binary with Nuitka
        # --nofollow-import-to=pydantic.v1: Nuitka 4.x miscompiles
        # pydantic.v1 under 3.14 (NameError: SetStr); the app uses
        # pydantic v2 only and FastAPI tolerates the missing v1 shim.
        run: |
          uv run --no-dev --with nuitka -- python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --jobs="$(nproc)" \
            --output-dir=build \
            --output-filename=airunit-server \
            --nofollow-import-to=pydantic.v1 \
            main.py

      - name: "Smoke test 1: boot without serial port"
        # The binary must get through all imports and fail exactly
        # where the source version fails (no serial hardware on CI).
        run: |
          rm -rf /tmp/smoke1 && mkdir -p /tmp/smoke1 && cd /tmp/smoke1
          if UART_PORT=/dev/does-not-exist \
             LOG_FILE=/tmp/smoke1/app.log \
             STORAGE_DIR=/tmp/smoke1/storage \
             "$GITHUB_WORKSPACE/server/build/airunit-server" --non-interactive 2>&1 \
             | grep -q "failed to open serial port"; then
            echo "boot-through-imports OK"
          else
            echo "binary failed before serial init"; exit 1
          fi

      - name: "Smoke test 2: full boot with PTY + HTTP"
        run: |
          rm -rf /tmp/smoke2 && mkdir -p /tmp/smoke2 && cd /tmp/smoke2
          python3 -c "import pty,os,time; m,s=pty.openpty(); print(os.ttyname(s),flush=True); time.sleep(90)" > pty.txt 2>&1 &
          sleep 1
          SLAVE=$(cat pty.txt)
          UART_PORT="$SLAVE" \
          LOG_FILE=/tmp/smoke2/app.log \
          STORAGE_DIR=/tmp/smoke2/storage \
          "$GITHUB_WORKSPACE/server/build/airunit-server" --non-interactive > server.log 2>&1 &
          SRV=$!
          sleep 10
          curl -fsS --max-time 10 http://localhost:8000/openapi.json > /dev/null
          curl -fsS --max-time 10 http://localhost:8000/docs > /dev/null
          kill "$SRV"
          echo "HTTP smoke OK"

      - name: Package artifact
        run: |
          cp build/airunit-server airunit-server-aarch64
          sha256sum airunit-server-aarch64 > airunit-server-aarch64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: airunit-server-aarch64
          path: |
            server/airunit-server-aarch64
            server/airunit-server-aarch64.sha256
            server/server-sha.txt

  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: airunit-server-aarch64

      - name: Load built SHA
        run: echo "SERVER_SHA=$(cat server-sha.txt)" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          body: |
            Server ref: `${{ inputs.server_ref }}`
            Server SHA: `${{ env.SERVER_SHA }}`
          files: |
            airunit-server-aarch64
            airunit-server-aarch64.sha256
